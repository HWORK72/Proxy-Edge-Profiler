services:
  postgres:
    image: postgres:16-alpine
    container_name: profiler_postgres
    restart: always
    environment:
      POSTGRES_USER: profiler
      POSTGRES_PASSWORD: profiler_secret
      POSTGRES_DB: profiler_db
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profiler -d profiler_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: profiler_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: profiler_app
    restart: always
    environment:
      APP_ENV: production
      POSTGRES_USER: profiler
      POSTGRES_PASSWORD: profiler_secret
      POSTGRES_DB: profiler_db
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
